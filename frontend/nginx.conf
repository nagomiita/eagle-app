worker_processes  auto;  # CPUコア数に自動調整

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    
    # 静的ファイルのキャッシュ設定
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # gzip圧縮（画像は通常不要だが、念のため）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # サムネイル画像の配信
        location /static/thumbnails {
            alias /var/www/thumbnails;

            # シンボリックリンクを許可 (Windows版nginxでは未サポート)
            # disable_symlinks off;

            # キャッシュヘッダー（ブラウザキャッシュ）
            expires 1y;
            add_header Cache-Control "public, immutable";
            
            # アクセスログを無効化してパフォーマンス向上
            access_log off;
            
            # CORS設定（必要に応じて）
            add_header Access-Control-Allow-Origin *;
        }

        location /api {
            # In Docker containers, `127.0.0.1` refers to the container itself.
            # On macOS Docker Desktop, use host.docker.internal to reach services
            # running on the host (or use a `backend` service and proxy to that).
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # タイムアウト設定
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri /index.html;
            
            # フロントエンドファイルのキャッシュ
            expires 1h;
            add_header Cache-Control "public";
        }
    }
}